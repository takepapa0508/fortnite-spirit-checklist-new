<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フォートナイト・スピリット・チェックリスト</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080d1c;
  color:#fff;
  font-family:Arial,"Noto Sans JP",sans-serif;
}
.container{
  width:min(1100px,100%);
  margin:auto;
  padding:18px 12px 40px;
}
h1{
  margin:0 0 12px;
  text-align:center;
  font-size:clamp(22px,4vw,34px);
  text-shadow:0 3px 8px #000;
}
.topbar{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-bottom:10px;
}
button{
  border:1px solid #53627f;
  border-radius:8px;
  background:#18233b;
  color:#fff;
  padding:9px 13px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{filter:brightness(1.18)}
button.active{background:#2e6cff;border-color:#8db0ff}
.counter{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}
.progress{
  height:13px;
  border-radius:99px;
  background:#202b40;
  overflow:hidden;
  margin:0 auto 14px;
  max-width:800px;
}
.progress-bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#36a8ff,#7b5cff);
  transition:width .25s;
}
.stage-wrap{
  width:min(100%,1100px);
  margin:auto;
}
.stage{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:url("assets/background.jpg") center/100% 100% no-repeat;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
}
.spirit{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--w);
  height:var(--w);
  transform:translate(-50%,-50%);
  cursor:pointer;
  user-select:none;
  transition:filter .15s,opacity .15s;
}
.spirit:hover{filter:brightness(1.15)}
.spirit img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.65));
}
.spirit.hidden{display:none}
.badge{
  position:absolute;
  right:3%;
  top:3%;
  width:20%;
  aspect-ratio:1;
  border-radius:50%;
  background:#24d36b;
  border:2px solid #fff;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:clamp(9px,1.5vw,16px);
  font-weight:bold;
  box-shadow:0 2px 6px #000;
}
.spirit.owned .badge{display:flex}
#completion{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
}
#completion.show{display:flex}
.complete-box{
  width:min(90%,430px);
  padding:28px;
  text-align:center;
  border:2px solid #fff;
  border-radius:18px;
  background:#17223a;
  box-shadow:0 15px 50px #000;
}
.complete-box h2{margin-top:0;font-size:30px}
.note{
  text-align:center;
  opacity:.7;
  font-size:12px;
  margin-top:10px;
}
@media(max-width:600px){
  .container{padding:10px 6px 25px}
  button{padding:8px 10px;font-size:12px}
  .counter{font-size:17px}
}
</style>
</head>

<body>
<div class="container">
  <h1>フォートナイト・スピリット・チェックリスト</h1>

  <div class="topbar" id="categoryButtons">
    <button data-category="new" class="active">新種</button>
    <button data-category="bounty">バウンティハンター</button>
    <button data-category="all">全種</button>
  </div>

  <div class="counter" id="counter">0 / 20</div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div class="topbar">
    <button data-filter="all" class="active">すべて</button>
    <button data-filter="missing">未取得</button>
    <button data-filter="owned">取得済み</button>
    <button id="saveBtn">画像保存</button>
    <button id="resetBtn">すべて解除</button>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage"></div>
  </div>
  <div class="note">精霊をクリックすると取得済みになります。取得状況はこのブラウザに保存されます。</div>
</div>

<div id="completion">
  <div class="complete-box">
    <h2>🎉 COMPLETE! 🎉</h2>
    <p id="completeText"></p>
    <button id="closeCompletion">閉じる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
/*
  ===== 精霊の個別配置 =====
  x = 横位置、y = 縦位置、w = 大きさ
  すべて「%」なので、画面サイズが変わっても配置比率を維持します。
  個別に動かしたい場合は、この表の x / y / w を変更してください。
*/

const layouts = {
  new: [
    [26,23,16.5],[40.5,23,16.5],[55.5,23,16.5],[70.5,23,16.5],
    [26,39,16.5],[40.5,39,16.5],[55.5,39,16.5],[70.5,39,16.5],
    [26,55,16.5],[40.5,55,16.5],[55.5,55,16.5],[70.5,55,16.5],
    [26,71,16.5],[40.5,71,16.5],[55.5,71,16.5],[70.5,71,16.5],
    [26,88,16.5],[40.5,88,16.5],[55.5,88,16.5],[70.5,88,16.5]
  ],
  bounty: [
    [22,24,15.5],[37,24,15.5],[52,24,15.5],[67,24,15.5],[82,24,15.5],
    [22,43,15.5],[37,43,15.5],[52,43,15.5],[67,43,15.5],[82,43,15.5],
    [22,61,15.5],[37,61,15.5],[52,61,15.5],[67,61,15.5],[82,61,15.5],
    [22,79,15.5],[37,79,15.5],[52,79,15.5],[67,79,15.5],[82,79,15.5]
  ]
};

/* 全種は、添付画像の配列（6-7-7-7-6-5）を再現します。 */
const allLayout = [
  /* 1行目：6体 */
  [7,9,13.5],[22,9,13.5],[37,9,13.5],[52,9,13.5],[67,9,13.5],[82,9,13.5],
  /* 2行目：7体 */
  [7,26,12.5],[21.3,26,12.5],[35.6,26,12.5],[49.9,26,12.5],[64.2,26,12.5],[78.5,26,12.5],[92.8,26,12.5],
  /* 3行目：7体 */
  [7,43,12.5],[21.3,43,12.5],[35.6,43,12.5],[49.9,43,12.5],[64.2,43,12.5],[78.5,43,12.5],[92.8,43,12.5],
  /* 4行目：7体 */
  [7,60,12.5],[21.3,60,12.5],[35.6,60,12.5],[49.9,60,12.5],[64.2,60,12.5],[78.5,60,12.5],[92.8,60,12.5],
  /* 5行目：6体 */
  [8,77,13.5],[24.8,77,13.5],[41.6,77,13.5],[58.4,77,13.5],[75.2,77,13.5],[92,77,13.5],
  /* 6行目：5体 */
  [14,93,13.5],[32,93,13.5],[50,93,13.5],[68,93,13.5],[86,93,13.5]
];

/* 全種の表示順：指定済みの40体の並び */
const allIds = [
  /* 画像で指定された40体の配列：左→右、上→下 */
  'bounty16','bounty17','bounty18','bounty19','bounty12','bounty15',
  'new05','new06','new07','new08','bounty03','bounty10','bounty20',
  'new09','new10','new11','new12','bounty05','bounty06','bounty14',
  'new13','new14','new15','new16','bounty04','bounty08','bounty13',
  'new01','new02','new03','new04','bounty07','bounty11',
  'new17','new18','new19','new20','bounty09'
];

const stage = document.getElementById("stage");
const counter = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const complete = document.getElementById("completion");
const completeText = document.getElementById("completeText");

let category = "new";
let filter = "all";
let owned = JSON.parse(localStorage.getItem("fortniteSpiritOwned") || "{}");

function idsFor(cat){
  if(cat==="new") return Array.from({length:20},(_,i)=>`new${String(i+1).padStart(2,"0")}`);
  if(cat==="bounty") return Array.from({length:20},(_,i)=>`bounty${String(i+1).padStart(2,"0")}`);
  return allIds;
}

function makeSpirit(id,index,cat){
  const p = cat==="all" ? allLayout[index] : layouts[cat][index];
  const el = document.createElement("article");
  el.className = "spirit";
  el.dataset.id = id;
  el.style.setProperty("--x",p[0]+"%");
  el.style.setProperty("--y",p[1]+"%");
  el.style.setProperty("--w",p[2]+"%");
  el.innerHTML = `
    <img src="assets/${id}.png" alt="${id}" draggable="false">
    <span class="badge">✓</span>
  `;
  el.addEventListener("click",()=>{
    owned[id] = !owned[id];
    localStorage.setItem("fortniteSpiritOwned",JSON.stringify(owned));
    update();
  });
  return el;
}

function buildStage(){
  stage.innerHTML="";
  const ids=idsFor(category);
  ids.forEach((id,i)=>{
    const group=id.startsWith("new")?"new":"bounty";
    const index=category==="all" ? i : Number(id.slice(-2))-1;
    stage.appendChild(makeSpirit(id,index,category==="all"?"all":group));
  });
  cropTransparentPadding();
}

function update(){
  const ids=idsFor(category);
  const count=ids.filter(id=>owned[id]).length;
  counter.textContent=`${count} / ${ids.length}`;
  progressBar.style.width=(count/ids.length*100)+"%";

  document.querySelectorAll(".spirit").forEach(el=>{
    const id=el.dataset.id;
    el.classList.toggle("owned",!!owned[id]);
    const show =
      filter==="all" ||
      (filter==="owned" && !!owned[id]) ||
      (filter==="missing" && !owned[id]);
    el.classList.toggle("hidden",!show);
  });

  document.querySelectorAll("[data-category]").forEach(b=>{
    b.classList.toggle("active",b.dataset.category===category);
  });
  document.querySelectorAll("[data-filter]").forEach(b=>{
    b.classList.toggle("active",b.dataset.filter===filter);
  });

  if(count===ids.length){
    completeText.textContent=`「${category==="new"?"新種":category==="bounty"?"バウンティハンター":"全種"}」をすべて取得しました！`;
    complete.classList.add("show");
  }
}

document.querySelectorAll("[data-category]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    category=btn.dataset.category;
    buildStage();
    update();
  });
});

document.querySelectorAll("[data-filter]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    filter=btn.dataset.filter;
    update();
  });
});

document.getElementById("closeCompletion").addEventListener("click",()=>{
  complete.classList.remove("show");
});

complete.addEventListener("click",e=>{
  if(e.target===complete) complete.classList.remove("show");
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("このブラウザに保存されている取得状況をすべて解除しますか？")) return;
  owned={};
  localStorage.removeItem("fortniteSpiritOwned");
  update();
});

document.getElementById("saveBtn").addEventListener("click",async()=>{
  /*
    「画像保存」は、表示中のstageそのものを直接キャプチャします。
    クローン・再配置・再計算は一切しません。
    そのため、選択画面と保存画像で精霊の大きさ・位置が変わりません。
    scale:1 にして、CSS上の表示サイズをそのまま1:1で保存します。
  */
  update();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  try{
    const canvas=await html2canvas(stage,{
      backgroundColor:null,
      useCORS:true,
      allowTaint:false,
      scale:1,
      scrollX:0,
      scrollY:0
    });

    const a=document.createElement("a");
    a.download=`fortnite-spirit-${category}-${filter}.png`;
    a.href=canvas.toDataURL("image/png");
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    alert("画像の保存に失敗しました");
    console.error(e);
  }
});

/*
  PNGの透明余白をブラウザ上で自動的に切り抜きます。
  元のassets画像は変更しません。
  これで「同じ枠なのに透明余白のせいで小さく見える」問題を防ぎます。
*/
function cropTransparentPadding(){
  const imgs=[...stage.querySelectorAll("img")];

  imgs.forEach(img=>{
    if(img.dataset.cropped==="1") return;

    const crop=()=>{
      if(img.dataset.cropped==="1" || !img.naturalWidth) return;

      try{
        const w=img.naturalWidth;
        const h=img.naturalHeight;
        const c=document.createElement("canvas");
        c.width=w;
        c.height=h;
        const ctx=c.getContext("2d",{willReadFrequently:true});
        ctx.drawImage(img,0,0);

        const data=ctx.getImageData(0,0,w,h).data;
        let left=w, top=h, right=-1, bottom=-1;

        for(let y=0;y<h;y++){
          for(let x=0;x<w;x++){
            if(data[(y*w+x)*4+3]>10){
              if(x<left) left=x;
              if(x>right) right=x;
              if(y<top) top=y;
              if(y>bottom) bottom=y;
            }
          }
        }

        if(right<left || bottom<top){
          img.dataset.cropped="1";
          return;
        }

        const pad=2;
        left=Math.max(0,left-pad);
        top=Math.max(0,top-pad);
        right=Math.min(w-1,right+pad);
        bottom=Math.min(h-1,bottom+pad);

        const cw=right-left+1;
        const ch=bottom-top+1;
        const out=document.createElement("canvas");
        out.width=cw;
        out.height=ch;
        out.getContext("2d").drawImage(c,left,top,cw,ch,0,0,cw,ch);

        img.src=out.toDataURL("image/png");
        img.dataset.cropped="1";
      }catch(e){
        img.dataset.cropped="1";
      }
    };

    if(img.complete && img.naturalWidth) crop();
    else img.addEventListener("load",crop,{once:true});
  });
}


buildStage();
update();
</script>
</body>
</html>
